<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crucial Elements of Success — Worksheet</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --stable:#21245C;
  --fresh:#00ADED;
  --passionate:#E34554;
  --gray:#EDEDED;
  --body:#333333;
  --subtle:#666666;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',Arial,sans-serif;background:#F7F7F9;color:var(--body);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px}
.logo{height:34px;display:block;margin:8px 0 20px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 14px rgba(33,36,92,.07);padding:36px;margin-bottom:20px}
.hero{background:var(--stable);border-radius:16px;color:#fff;text-align:center;padding:44px 30px;margin-bottom:20px}
.hero h1{font-size:28px;font-weight:500;letter-spacing:.3px}
.hero .sub{font-size:13px;font-weight:200;opacity:.85;margin-top:8px;text-transform:uppercase;letter-spacing:3px}
h2.section-label{color:var(--fresh);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.card p{font-size:15px;line-height:1.65;margin-bottom:12px}
.field{margin:18px 0 4px}
.field label{display:block;font-size:13px;color:var(--subtle);margin-bottom:6px}
input[type=text], textarea{width:100%;font-family:'Poppins',Arial,sans-serif;font-size:15px;color:var(--body);border:1.5px solid #D8D8DE;border-radius:10px;padding:12px 14px;background:#fff}
input[type=text]:focus, textarea:focus{outline:none;border-color:var(--fresh)}
textarea{resize:vertical;min-height:170px;line-height:1.6}
.btn{display:inline-block;border:none;cursor:pointer;font-family:'Poppins',Arial,sans-serif;font-weight:600;font-size:16px;color:#fff;background:var(--fresh);border-radius:999px;padding:16px 46px;transition:transform .1s, box-shadow .15s;box-shadow:0 4px 16px rgba(0,173,237,.35)}
.btn:hover{transform:translateY(-1px)}
.btn.stable{background:var(--stable);box-shadow:0 4px 16px rgba(33,36,92,.3)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.progress{height:5px;background:var(--gray);border-radius:999px;overflow:hidden;margin-bottom:26px}
.progress span{display:block;height:100%;background:var(--fresh);border-radius:999px;transition:width .3s}
.q-eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--fresh);margin-bottom:4px}
.q-count{font-size:12px;color:var(--subtle);margin-bottom:18px}
.q-title{font-size:21px;font-weight:600;color:var(--stable);line-height:1.45;margin-bottom:26px}
.scale-hint{display:flex;justify-content:space-between;font-size:12px;color:var(--subtle);margin-bottom:8px}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.scores button{font-family:'Poppins',Arial,sans-serif;font-size:22px;font-weight:600;color:var(--stable);background:#fff;border:2px solid #D8D8DE;border-radius:14px;padding:22px 0;cursor:pointer;transition:all .12s}
.scores button:hover{border-color:var(--fresh);color:var(--fresh)}
.scores button.sel{background:var(--fresh);border-color:var(--fresh);color:#fff;box-shadow:0 4px 14px rgba(0,173,237,.4)}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.back{background:none;border:none;cursor:pointer;font-family:'Poppins',Arial,sans-serif;font-size:14px;color:var(--subtle);padding:10px 6px}
.back:hover{color:var(--stable)}
.rev-el{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px}
.rev-el .nm{font-size:17px;font-weight:600;color:var(--stable)}
.rev-el .sc{font-size:17px;font-weight:600;color:var(--fresh)}
.rev-belief-label{font-size:13px;color:var(--subtle);margin-bottom:4px}
.rev-belief{font-size:14px;line-height:1.6;white-space:pre-wrap}
.done-wrap{text-align:center;margin:0 0 20px}
.hidden{display:none}
@media(max-width:560px){
  .card{padding:26px 20px}
  .hero h1{font-size:23px}
  .scores{gap:8px}
  .scores button{padding:16px 0;font-size:19px}
}
</style>
</head>

<div class="hero">
  <h1>Crucial Elements of Success</h1>
  <div class="sub">Worksheet</div>
</div>

<!-- RATING -->
<div id="view-rate" class="hidden">
  <div class="card">
    <div class="progress"><span id="r-pbar"></span></div>
    <div class="q-eyebrow" id="r-eyebrow"></div>
    <div class="q-count" id="r-cnt"></div>
    <div class="q-title" id="r-title"></div>
    <div class="scale-hint"><span>1 &mdash; low</span><span>10 &mdash; high</span></div>
    <div class="scores" id="r-scores"></div>
    <div class="q-nav">
      <button class="back" id="r-back" onclick="nav(-1)">&larr; Back</button>
      <button class="btn stable" id="r-next" onclick="nav(1)" disabled>Next</button>
    </div>
  </div>
</div>

<!-- BELIEF -->
<div id="view-belief" class="hidden">
  <div class="card">
    <div class="progress"><span id="b-pbar"></span></div>
    <div class="q-eyebrow" id="b-eyebrow"></div>
    <div class="q-count" id="b-cnt"></div>
    <div class="q-title">The negative belief in my head that is keeping me from a higher score:</div>
    <textarea id="b-ta" oninput="onBelief()"></textarea>
    <div class="q-nav">
      <button class="back" onclick="nav(-1)">&larr; Back</button>
      <button class="btn stable" id="b-next" onclick="nav(1)">Next</button>
    </div>
  </div>
</div>

<!-- RESULTS -->
<div id="view-results" class="hidden">
  <div class="done-wrap">
    <button class="btn" onclick="finishUp()">Done &mdash; Download My Worksheet (PDF)</button>
    <div id="send-status" style="font-size:13px;color:var(--subtle);margin-top:12px"></div>
  </div>
  <div class="card">
    <h2 class="section-label">Crucial Elements of Success</h2>
    <div id="res-list"></div>
  </div>
</div>

</div>
<script>
const COACH_EMAIL='dan@lushin.com';
const ELEMENTS=["Desire","Commitment","Responsibility","Outlook"];
let ratings=[null,null,null,null];
let beliefs=['','','',''];
let cur=0; // 0..7: even = rating for element cur/2, odd = belief
const NSTEPS=8;

function store(){try{localStorage.setItem('dcor',JSON.stringify({r:ratings,b:beliefs}));}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem('dcor'));if(d&&d.r&&d.r.length===4){ratings=d.r;beliefs=d.b||beliefs;}}catch(e){}}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function show(id){['view-rate','view-belief','view-results'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==id));window.scrollTo(0,0);}
function go(i){cur=i;render();location.hash='p'+(i+1);}
function nav(d){
  const n=cur+d;
  if(n<0)return;
  if(n>=NSTEPS){showResults();return;}
  go(n);
}
function render(){
  const el=Math.floor(cur/2),isRate=cur%2===0;
  if(isRate){
    show('view-rate');
    document.getElementById('r-pbar').style.width=(cur/NSTEPS*100)+'%';
    document.getElementById('r-eyebrow').textContent=ELEMENTS[el];
    document.getElementById('r-cnt').textContent=(cur+1)+' of '+NSTEPS;
    document.getElementById('r-title').textContent='How I would rate my '+ELEMENTS[el]+' over the past 6 months:';
    const sc=document.getElementById('r-scores');
    sc.innerHTML='';
    for(let i=1;i<=10;i++){
      const b=document.createElement('button');
      b.textContent=i;
      if(ratings[el]===i)b.classList.add('sel');
      b.onclick=()=>{
        ratings[el]=i;store();
        sc.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        document.getElementById('r-next').disabled=false;
        setTimeout(()=>nav(1),260);
      };
      sc.appendChild(b);
    }
    document.getElementById('r-back').style.visibility=cur===0?'hidden':'visible';
    document.getElementById('r-next').disabled=ratings[el]===null;
  }else{
    show('view-belief');
    document.getElementById('b-pbar').style.width=(cur/NSTEPS*100)+'%';
    document.getElementById('b-eyebrow').textContent=ELEMENTS[el]+' — rated '+ratings[el]+'/10';
    document.getElementById('b-cnt').textContent=(cur+1)+' of '+NSTEPS;
    const ta=document.getElementById('b-ta');
    ta.value=beliefs[el]||'';
    document.getElementById('b-next').textContent=cur===NSTEPS-1?'Submit':'Next';
    ta.focus();
  }
}
function onBelief(){
  const el=Math.floor(cur/2);
  beliefs[el]=document.getElementById('b-ta').value;
  store();
}
function showResults(){
  store();
  document.getElementById('res-list').innerHTML=ELEMENTS.map((e,i)=>
    '<div class="rev-el"><span class="nm">'+e+'</span><span class="sc">'+ratings[i]+' / 10</span></div>'+
    '<div class="rev-belief-label">The negative belief in my head that is keeping me from a higher score:</div>'+
    '<div class="rev-belief">'+(esc(beliefs[i].trim())||'&mdash;')+'</div>'
  ).join('');
  show('view-results');
  location.hash='results';
}

/* ---------- Email ---------- */
function sendResults(){
  const st=document.getElementById('send-status');
  st.textContent='Sending...';
  const payload={
    _subject:'Crucial Elements of Success: D'+ratings[0]+' C'+ratings[1]+' R'+ratings[2]+' O'+ratings[3],
    _template:'box'
  };
  ELEMENTS.forEach((e,i)=>{
    payload[e+' - Rating']=ratings[i]+'/10';
    payload[e+' - Negative belief']=beliefs[i].trim()||'-';
  });
  return fetch('https://formsubmit.co/ajax/'+COACH_EMAIL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(payload)
  }).then(r=>{if(!r.ok)throw new Error('send failed');return r.json();})
  .then(()=>{st.textContent='Sent.';})
  .catch(()=>{st.innerHTML='Could not send automatically. <a href="'+mailtoLink()+'" style="color:var(--fresh)">Click here to email your worksheet</a>.';});
}
function resultsText(){
  let s='Crucial Elements of Success - Worksheet\n\n';
  ELEMENTS.forEach((e,i)=>{
    s+=e+': '+ratings[i]+'/10\nThe negative belief in my head that is keeping me from a higher score:\n'+(beliefs[i].trim()||'-')+'\n\n';
  });
  return s;
}
function mailtoLink(){
  return 'mailto:'+COACH_EMAIL+'?subject='+encodeURIComponent('Crucial Elements of Success')+'&body='+encodeURIComponent(resultsText());
}
function finishUp(){sendResults();downloadPDF();}

/* ---------- PDF ---------- */
function loadLogo(cb){
  const img=new Image();
  img.onload=function(){
    try{
      const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
      c.getContext('2d').drawImage(img,0,0);
      cb(c.toDataURL('image/png'),img.width/img.height);
    }catch(e){cb(null);}
  };
  img.onerror=function(){cb(null);};
  img.src=document.querySelector('.logo').src;
}
function downloadPDF(){
  loadLogo(function(logo,ratio){
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'pt',format:'letter'});
    const W=612,M=54,CW=W-M*2;
    const STABLE=[33,36,92],FRESH=[0,173,237],BODY=[51,51,51];
    let y=0;
    doc.setFillColor(33,36,92);doc.rect(0,0,W,88,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');doc.setFontSize(20);
    doc.text('Crucial Elements of Success',W/2,44,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(9);
    doc.text('W O R K S H E E T',W/2,64,{align:'center'});
    y=116;
    doc.setTextColor(102,102,102);doc.setFontSize(10);
    const d=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    doc.text(d,M,y);
    y+=30;
    function ensure(h){if(y+h>742){doc.addPage();y=60;}}
    ELEMENTS.forEach(function(e,i){
      ensure(70);
      doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(STABLE[0],STABLE[1],STABLE[2]);
      doc.text('How I would rate my '+e+' over the past 6 months:',M,y);
      doc.setTextColor(FRESH[0],FRESH[1],FRESH[2]);
      doc.text(ratings[i]+' / 10',W-M,y,{align:'right'});
      y+=20;
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(STABLE[0],STABLE[1],STABLE[2]);
      doc.text('The negative belief in my head that is keeping me from a higher score:',M,y);
      y+=15;
      doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(BODY[0],BODY[1],BODY[2]);
      const lines=doc.splitTextToSize(beliefs[i].trim()||'—',CW-10);
      ensure(lines.length*14+18);
      doc.text(lines,M+10,y);
      y+=lines.length*14+24;
    });
    if(logo){ensure(50);const lw=90,lh=lw/ratio;doc.addImage(logo,'PNG',M,y+8,lw,lh);}
    doc.save('Crucial Elements of Success.pdf');
  });
}
restore();go(0);
</script>
